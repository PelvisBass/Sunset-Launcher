name: Test and package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_LINUX_LIBRARIES: >-
    libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0 libice6 libsm6
    libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0
    libxcb-render-util0 libxcb-shape0 libxcb-xinput0 libxkbcommon-x11-0 libxrender1

jobs:
  test:
    name: Source tests (${{ matrix.runner }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: '3.10'
          - runner: windows-2025
            python: '3.13'
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install Linux desktop system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          read -ra qt_libraries <<< "$QT_LINUX_LIBRARIES"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${qt_libraries[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Start the desktop app
        run: uv run --locked python -m sunset_launcher --smoke-test

  bundle:
    name: Build Linux x86-64 bundle
    runs-on: ubuntu-24.04
    # Keep the glibc 2.35 build baseline independent of the hosted runner image.
    container: ubuntu:22.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and desktop system libraries
        run: |
          read -ra qt_libraries <<< "$QT_LINUX_LIBRARIES"
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates git "${qt_libraries[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: '3.13'
      - name: Build the standalone launcher
        run: |
          uv sync --locked --extra bundle
          uv run --no-sync python scripts/build_bundle.py
      - name: Archive with executable permissions and symlinks
        run: |
          test -x dist/SunsetLauncher/SunsetLauncher
          mkdir release
          tar -C dist -czf release/SunsetLauncher-linux-x86_64.tar.gz SunsetLauncher
          cd release
          sha256sum SunsetLauncher-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SunsetLauncher-linux-x86_64
          path: release/
          if-no-files-found: error
          compression-level: 0

  bundle-windows:
    name: Build and test Windows x86-64 bundle
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: '3.13'
      - name: Build the standalone launcher
        run: |
          uv sync --locked --extra bundle
          uv run --no-sync python scripts/build_bundle.py
      - name: Start the bundled application
        shell: pwsh
        run: |
          # The GUI build has no console, so check its exit code instead of its output.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process -FilePath dist\SunsetLauncher\SunsetLauncher.exe -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($app.ExitCode -ne 0) { throw "Smoke test exited with code $($app.ExitCode)" }
      - name: Archive the application folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Compress-Archive -Path dist\SunsetLauncher -DestinationPath release\SunsetLauncher-windows-x86_64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SunsetLauncher-windows-x86_64
          path: release/
          if-no-files-found: error
          compression-level: 0

  bundle-smoke:
    name: Standalone desktop smoke test (${{ matrix.image }})
    needs: bundle
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12-slim']
    defaults:
      run:
        shell: bash
    steps:
      - name: Install desktop system libraries and virtual display
        run: |
          read -ra qt_libraries <<< "$QT_LINUX_LIBRARIES"
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates fonts-dejavu-core xauth xvfb "${qt_libraries[@]}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SunsetLauncher-linux-x86_64
          path: release
      - name: Start the unpacked application
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          tar -xzf SunsetLauncher-linux-x86_64.tar.gz
          test -x SunsetLauncher/SunsetLauncher
          QT_QPA_PLATFORM=offscreen ./SunsetLauncher/SunsetLauncher --smoke-test
          QT_QPA_PLATFORM=xcb xvfb-run -a ./SunsetLauncher/SunsetLauncher --smoke-test

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, bundle-smoke, bundle-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SunsetLauncher-linux-x86_64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SunsetLauncher-windows-x86_64
          path: release
      - name: Publish the tested archives and checksums
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS
          sha256sum SunsetLauncher-linux-x86_64.tar.gz SunsetLauncher-windows-x86_64.zip > SHA256SUMS
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --generate-notes
          fi
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          if [[ $draft == false ]]; then
            echo "Release $tag is already published."
            exit 0
          fi
          [[ $draft == true ]]
          for asset in SunsetLauncher-linux-x86_64.tar.gz SunsetLauncher-windows-x86_64.zip SHA256SUMS; do
            digest=$(sha256sum "$asset")
            digest="sha256:${digest%% *}"
            filter=".assets[] | select(.name == \"$asset\" and .state == \"uploaded\") | .digest"
            if [[ $(gh release view "$tag" --json assets --jq "$filter") == "$digest" ]]; then
              continue
            fi
            # GitHub can report a duplicate after receiving an upload. Confirm the stored checksum.
            if ! gh release upload "$tag" "$asset"; then
              echo "Checking the stored copy of $asset after an upload error."
            fi
            if [[ $(gh release view "$tag" --json assets --jq "$filter") != "$digest" ]]; then
              echo "Could not verify $asset in the draft release."
              exit 1
            fi
          done
          gh release edit "$tag" --draft=false
