[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunset-launcher"
version = "0.7.0"
description = "Desktop build and launch manager for Xbox Series compatibility layers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # PySide6 6.12.0 can corrupt Python 3.10/3.11 reference counts (PYSIDE-3474).
    # https://qt-project.atlassian.net/browse/PYSIDE-3474
    "PySide6-Essentials>=6.8,<6.12; python_version < '3.12'",
    "PySide6-Essentials>=6.8,<7; python_version >= '3.12'",
]

[project.optional-dependencies]
bundle = ["pyinstaller>=6.16,<7; sys_platform == 'linux' or sys_platform == 'win32'"]

[project.gui-scripts]
sunset-launcher = "sunset_launcher.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
sunset_launcher = ["style.qss", "assets/harbor.jpg", "assets/chevron-down.png", "assets/check.png"]
